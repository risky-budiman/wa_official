# ===========================================
# Nginx Reverse Proxy — WhatsApp CRM
# ===========================================
# Taruh file ini di /etc/nginx/sites-available/wa-crm
# Lalu symlink ke /etc/nginx/sites-enabled/
#
# sudo ln -s /etc/nginx/sites-available/wa-crm /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

# Rate Limiting Zone (anti-abuse)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/s;

# Upstream Servers
upstream backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream frontend {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name crm.domainanda.com;  # <-- GANTI dengan domain Anda

    # Redirect ke HTTPS (uncomment setelah SSL aktif)
    # return 301 https://$server_name$request_uri;

    # ─── Webhook Meta (harus bisa diakses tanpa SSL saat testing) ───
    location /api/v1/webhook {
        limit_req zone=webhook_limit burst=50 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Meta webhook bisa kirim payload besar
        client_max_body_size 10m;
    }

    # ─── Backend API ───
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50m;
    }

    # ─── WebSocket ───
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;  # Keep WebSocket alive 24 jam
        proxy_send_timeout 86400;
    }

    # ─── Backend Health Check ───
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ─── Frontend (SvelteKit SSR) ───
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SvelteKit HMR WebSocket (hanya dev, bisa dihapus di production)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ─── Security Headers ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

